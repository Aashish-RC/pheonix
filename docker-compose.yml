version: "3.8"

services:
  # Vector Store for Memory Engine & Embeddings
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: pheonix-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage

  # Local Model Serving for Offline / Dev Execution
  ollama:
    image: ollama/ollama:latest
    container_name: pheonix-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Global Fast Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: pheonix-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKeyPheonix2026
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # Novu self-hosted stack
  novu-redis:
    image: redis:7-alpine
    container_name: pheonix-novu-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  novu-mongodb:
    image: mongo:8.0.17
    container_name: pheonix-novu-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${NOVU_MONGO_PASSWORD:-novu-dev-password}
    volumes:
      - novu_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "root",
          "--password",
          "${NOVU_MONGO_PASSWORD:-novu-dev-password}",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  novu-api:
    image: ghcr.io/novuhq/novu/api:3.19.0
    container_name: pheonix-novu-api
    restart: unless-stopped
    depends_on:
      novu-mongodb:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: local
      API_ROOT_URL: ${NOVU_API_URL:-http://localhost:3001}
      PORT: 3000
      FRONT_BASE_URL: ${NOVU_DASHBOARD_URL:-http://localhost:3005}
      MONGO_URL: mongodb://root:${NOVU_MONGO_PASSWORD:-novu-dev-password}@novu-mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      MONGO_AUTO_CREATE_INDEXES: "true"
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: novu-redis
      REDIS_CACHE_SERVICE_PORT: 6379
      S3_LOCAL_STACK: ""
      S3_BUCKET_NAME: novu-local
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: ${NOVU_JWT_SECRET:-pheonix-local-dev-jwt-secret-change-before-deploy}
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:-pheonix-local-dev-secret-change-before-deploy}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      API_CONTEXT_PATH: ""
      IS_API_IDEMPOTENCY_ENABLED: "false"
      IS_API_RATE_LIMITING_ENABLED: "false"
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
      IS_V2_ENABLED: "true"
      IS_SELF_HOSTED: "true"
      SENTRY_DSN: ""
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_APP_NAME: pheonix
      NEW_RELIC_LICENSE_KEY: ""
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/v1/health-check || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:3.19.0
    container_name: pheonix-novu-worker
    restart: unless-stopped
    depends_on:
      novu-mongodb:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      NODE_ENV: local
      PORT: 3004
      MONGO_URL: mongodb://root:${NOVU_MONGO_PASSWORD:-novu-dev-password}@novu-mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: novu-redis
      REDIS_CACHE_SERVICE_PORT: 6379
      S3_LOCAL_STACK: ""
      S3_BUCKET_NAME: novu-local
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      SENTRY_DSN: ""
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_APP_NAME: pheonix
      NEW_RELIC_LICENSE_KEY: ""
      BROADCAST_QUEUE_CHUNK_SIZE: 100
      MULTICAST_QUEUE_CHUNK_SIZE: 100
      API_ROOT_URL: http://novu-api:3000
      IS_EMAIL_INLINE_CSS_DISABLED: "false"
      IS_USE_MERGED_DIGEST_ID_ENABLED: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/v1/health-check || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  novu-ws:
    image: ghcr.io/novuhq/novu/ws:3.19.0
    container_name: pheonix-novu-ws
    restart: unless-stopped
    depends_on:
      novu-mongodb:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: local
      MONGO_URL: mongodb://root:${NOVU_MONGO_PASSWORD:-novu-dev-password}@novu-mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${NOVU_JWT_SECRET:-pheonix-local-dev-jwt-secret-change-before-deploy}
      WS_CONTEXT_PATH: ""
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_APP_NAME: pheonix
      NEW_RELIC_LICENSE_KEY: ""
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/v1/health-check || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  novu-dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.19.0
    container_name: pheonix-novu-dashboard
    restart: unless-stopped
    depends_on:
      novu-api:
        condition: service_healthy
      novu-worker:
        condition: service_healthy
    ports:
      - "3005:4000"
    environment:
      VITE_API_HOSTNAME: ${NOVU_API_URL:-http://localhost:3001}
      VITE_WEBSOCKET_HOSTNAME: ${NOVU_WS_URL:-http://localhost:3002}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://localhost:4000/',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1)});\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Local Mock SMTP Server for Email Testing
  smtp:
    image: axllent/mailpit:v1.15
    container_name: pheonix-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI

  # High-Performance Model Gateway Service
  model-gateway:
    build:
      context: ./model-gateway
      dockerfile: Dockerfile
    container_name: pheonix-model-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  qdrant_data:
  ollama_models:
  meili_data:
  novu_mongodb_data:
