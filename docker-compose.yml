version: "3.8"

services:
  # Vector Store for Memory Engine & Embeddings
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: pheonix-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage

  # Local Model Serving for Offline / Dev Execution
  ollama:
    image: ollama/ollama:latest
    container_name: pheonix-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Global Fast Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: pheonix-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKeyPheonix2026
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # Notifications Subsystem
  novu:
    image: novuhq/novu:0.24.2
    container_name: pheonix-novu
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000

  # Local Mock SMTP Server for Email Testing
  smtp:
    image: axllent/mailpit:v1.15
    container_name: pheonix-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI

  # High-Performance Model Gateway Service
  model-gateway:
    build:
      context: ./model-gateway
      dockerfile: Dockerfile
    container_name: pheonix-model-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  qdrant_data:
  ollama_models:
  meili_data:
