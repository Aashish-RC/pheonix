[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-tools-mcp"
version = "0.1.0"
description = "Pheonix Curated Tool and Model Context Protocol (MCP) Registry with On-Demand Credential Activation"
authors = [{ name = "Pheonix Team" }]
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
