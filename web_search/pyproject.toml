[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-web-search"
version = "0.1.0"
description = "Pheonix Web Search, Polite Scraping, and Grounded Source-Support Citation Verification"
authors = [{ name = "Pheonix Engineering" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
asyncio_mode = "auto"
