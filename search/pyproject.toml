[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-search"
version = "0.1.0"
description = "Pheonix Global Hybrid Search Engine: Lexical BM25, Semantic Vectors, and Multi-Corpus RRF"
authors = [{ name = "Pheonix Engineering" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
asyncio_mode = "auto"
