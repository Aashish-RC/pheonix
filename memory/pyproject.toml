[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-memory"
version = "0.1.0"
description = "Fused Dynamic Memory Layer for AI Agents (Mem0 + Letta architecture with 3-tier memory and 4 stitches)"
authors = [
    { name = "Pheonix AI Team" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "numpy>=1.24.0",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
qdrant = ["qdrant-client>=1.8.0"]
chroma = ["chromadb>=0.4.22"]
postgres = ["psycopg2-binary>=2.9.0", "SQLAlchemy>=2.0.0"]
mcp = ["mcp>=1.0.0"]
llm = ["openai>=1.12.0", "litellm>=1.20.0"]
all = [
    "redis>=5.0.0",
    "qdrant-client>=1.8.0",
    "psycopg2-binary>=2.9.0",
    "SQLAlchemy>=2.0.0",
    "mcp>=1.0.0",
    "openai>=1.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["config", "engine"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
