[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-skills-packaging"
version = "0.1.0"
description = "Pheonix Portable Skill and Plugin Packaging Engine with Sandboxed Installation and Hot-Reload Runtime"
authors = [{ name = "Pheonix Team" }]
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
