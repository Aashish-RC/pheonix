[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-agent"
version = "0.1.0"
description = "Enterprise-Grade Decoupled Agent Layer (Builder + Executor + Fused Memory + Sandbox + Guardrails + MCP)"
authors = [
    { name = "Pheonix AI Team" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jsonschema>=4.21.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
agno = ["agno>=1.0.0"]
memory = ["redis>=5.0.0", "qdrant-client>=1.8.0"]
sandbox = ["e2b>=0.1.0", "docker>=7.0.0"]
voice = ["livekit>=0.11.0", "livekit-api>=0.5.0"]
mcp = ["mcp>=1.0.0"]
all = [
    "redis>=5.0.0",
    "qdrant-client>=1.8.0",
    "jsonschema>=4.21.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
