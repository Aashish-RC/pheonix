[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-recommender"
version = "0.1.0"
description = "Pheonix Multi-Objective Empirical Recommender Engine with Second-Opinion Arbitration"
authors = [{ name = "Pheonix Team" }]
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
