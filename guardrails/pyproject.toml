[project]
name = "pheonix-guardrails"
version = "0.1.0"
description = "Pheonix Guardrails and Safety v0: Jailbreak Prevention, PII Sanitization, and Crisis Response"
authors = [{ name = "Pheonix Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["..", "."]
asyncio_mode = "auto"
