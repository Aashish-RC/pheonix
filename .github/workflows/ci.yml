          python -m pytest tests/

      - name: Run Release Finishing & Update Channel Tests (Pytest)
        run: |
          cd release_finishing
          python -m pytest tests/

      - name: Run Resource Optimizer Tests (Pytest)
        run: |
          cd resource_optimizer
          python -m pytest tests/

      - name: Run Agent Layer Tests (Pytest)
        run: |
          cd agent
          python -m pytest tests/

      - name: Run Root Integration Tests (Pytest)
        run: |
          python -m pytest tests/

      - name: Run Unified Test Runner (All 35 Modules)
        run: |
          python scripts/test_all.py

  live-integration:
    name: Live Integration (Manual Dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Start Live Services
        run: |
          docker compose up -d qdrant ollama meilisearch model-gateway
          docker compose exec -T ollama ollama pull llama3.2:1b

      - name: Run Live Integration Test
        env:
          PHEONIX_LIVE: "1"
        run: |
          python -m pytest -q -m live
