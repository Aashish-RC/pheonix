name: Pheonix Unified CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Invariant Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Leak Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Leaked Token Regex Pattern Check
        run: |
          echo "Scanning for high-entropy tokens and OpenAI/Anthropic/AWS leaked keys..."
          if grep -rE "(sk-proj-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})" . \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            --exclude-dir=".pytest_cache" \
            --exclude="*.md" \
            --exclude="attack_vectors.json"; then
            echo "ERROR: Leaked API credential detected in codebase!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Model Gateway Dependencies
        run: |
          cd model-gateway
          pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run Secret / Plaintext Invariant Scan
        run: |
          echo "Scanning for plaintext keys or committed secret files..."
          if find . -name "*.env" -not -path "*/.env.example" | grep -q .; then
            echo "ERROR: Disallowed .env files detected!"
            exit 1
          fi

      - name: Check for Undefined Names (Ruff F821)
        run: |
          ruff check --select F821 .

      - name: Static Type Checking (Mypy)
        run: |
          mypy audit permissions rules storage search --follow-imports=silent

      - name: Check Architecture Status Drift
        run: |
          python scripts/generate_status.py --check

      - name: Run Component Registry Tests (Pytest)
        run: |
          cd registry
          python -m pytest tests/

      - name: Run Cryptographic Vault Tests (Pytest)
        run: |
          cd vault
          python -m pytest tests/

      - name: Run Auth & Identity Tests (Pytest)
        run: |
          cd auth
          python -m pytest tests/

      - name: Run Unified Cross-Module Audit Tests (Pytest)
        run: |
          cd audit
          python -m pytest tests/

      - name: Run Rules Layer Tests (Pytest)
        run: |
          cd rules
          python -m pytest tests/

      - name: Run Provider Activation Tests (Pytest)
        run: |
          cd providers
          python -m pytest tests/

      - name: Run Model Gateway Tests (Vitest)
        run: |
          cd model-gateway
          pnpm test

      - name: Run Model Serving Tests (Pytest)
        run: |
          cd serving
          python -m pytest tests/

      - name: Run Observability Tests (Pytest)
        run: |
          cd observability
          python -m pytest tests/

      - name: Run Guardrails and Safety Tests (Pytest)
        run: |
          cd guardrails
          python -m pytest tests/

      - name: Run Subscription Tracker Tests (Pytest)
        run: |
          cd tracker
          python -m pytest tests/

      - name: Run Storage and Files Tests (Pytest)
        run: |
          cd storage
          python -m pytest tests/

      - name: Run Memory Engine Tests (Pytest)
        run: |
          cd memory
          python -m pytest tests/

      - name: Run Knowledge & Docs Tests (Pytest)
        run: |
          cd knowledge
          python -m pytest tests/

      - name: Run Global Search Tests (Pytest)
        run: |
          cd search
          python -m pytest tests/

      - name: Run Web Search & Verification Tests (Pytest)
        run: |
          cd web_search
          python -m pytest tests/

      - name: Run Canvas & Live Artifacts Tests (Pytest)
        run: |
          cd canvas
          python -m pytest tests/

      - name: Run Permission Modes Tests (Pytest)
        run: |
          cd permissions
          python -m pytest tests/

      - name: Run Orchestrator Tests (Pytest)
        run: |
          cd orchestrator
          python -m pytest tests/

      - name: Run Agent Sandboxes Tests (Pytest)
        run: |
          cd sandboxes
          python -m pytest tests/

      - name: Run Tool & MCP Registry Tests (Pytest)
        run: |
          cd tools_mcp
          python -m pytest tests/

      - name: Run Internal Agents Tests (Pytest)
        run: |
          cd internal_agents
          python -m pytest tests/

      - name: Run Empirical Recommender Tests (Pytest)
        run: |
          cd recommender
          python -m pytest tests/

      - name: Run Browser Automation Tests (Pytest)
        run: |
          cd browser_automation
          python -m pytest tests/

      - name: Run Agent Builder Tests (Pytest)
        run: |
          cd agent_builder
          python -m pytest tests/

      - name: Run Workflow Builder Tests (Pytest)
        run: |
          cd workflow_builder
          python -m pytest tests/

      - name: Run Skills & Plugin Packaging Tests (Pytest)
        run: |
          cd skills_packaging
          python -m pytest tests/

      - name: Run Notifications Tests (Pytest)
        run: |
          cd notifications
          python -m pytest tests/

      - name: Run Voice & Speech Tests (Pytest)
        run: |
          cd voice_speech
          python -m pytest tests/

      - name: Run Media Generation Tests (Pytest)
        run: |
          cd media_gen
          python -m pytest tests/

      - name: Run Translation Tests (Pytest)
        run: |
          cd translation
          python -m pytest tests/

      - name: Run Remote Access & Pairing Tests (Pytest)
        run: |
          cd remote_access
