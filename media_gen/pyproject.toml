[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-media-gen"
version = "0.1.0"
description = "Multi-Modal Media Generation Pipeline, Job Queue, Safety Filters and Gallery for Pheonix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
