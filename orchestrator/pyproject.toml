[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pheonix-orchestrator"
version = "0.1.0"
description = "Pheonix Multi-Step Task Planner, Parallel DAG Runner, and Cooperative Cancellation Engine"
authors = [{ name = "Pheonix Team" }]
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
